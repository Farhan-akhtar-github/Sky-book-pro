<template>
    <div class="slds-card" style="border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; overflow: hidden; background: white; position: relative;">
        
        <!-- Loading Spinner -->
        <template if:true={loading}>
            <div style="height: 200px; position: relative;">
                <lightning-spinner alternative-text="Loading booking details..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Main Details Content -->
        <template if:false={loading}>
            <template if:true={booking}>
                <!-- Header Info -->
                <div class="slds-card__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap" style="background: #fafafa; border-bottom: 1px solid #e5e7eb; padding: 16px 24px;">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <span style="font-size: 24px; display: inline-block;">📑</span>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title" style="font-size: 18px; font-weight: 700; color: #1b3a4b;">
                                Booking Details: {bookingRef}
                            </h2>
                            <p class="slds-text-body_small slds-text-color_weak">Booked on {formattedBookingDate}</p>
                        </div>
                    </div>
                    
                    <div class="slds-grid slds-grid_vertical-align-center" style="gap: 12px;">
                        <span class={statusBadgeClass}>{bookingStatus}</span>
                        <lightning-button
                            variant="neutral"
                            label="Download Itinerary"
                            icon-name="utility:download"
                            disabled>
                        </lightning-button>
                        <lightning-button
                            variant="neutral"
                            label="Back to Bookings"
                            icon-name="utility:back"
                            onclick={handleBack}>
                        </lightning-button>
                    </div>
                </div>

                <!-- Body columns -->
                <div class="slds-card__body slds-card__body_inner slds-p-around_large">
                    <!-- Error message banner -->
                    <template if:true={errorMessage}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                            <h2>{errorMessage}</h2>
                        </div>
                    </template>

                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- Left Column: Flight & Passengers -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                            
                            <!-- Route & Time Summary -->
                            <div class="slds-p-around_medium slds-m-bottom_large" style="border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa;">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                    <span style="font-size: 16px; font-weight: 800; color: #1b3a4b;">{flightRoute}</span>
                                    <span class="slds-badge slds-badge_lightest" style="font-size: 10px; background-color: #f1f5f9; color: #475569;">{cabinClass}</span>
                                </div>
                                <div class="slds-grid slds-wrap slds-gutters" style="font-size: 13px;">
                                    <div class="slds-col slds-size_1-of-2">
                                        <div style="font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase;">Departure</div>
                                        <div style="font-weight: 600; color: #1e293b;">{formattedDepartureTime}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <div style="font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase;">Arrival</div>
                                        <div style="font-weight: 600; color: #1e293b;">{formattedArrivalTime}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Flight Segments (Itinerary legs) -->
                            <template if:true={hasSegments}>
                                <div class="slds-p-around_medium slds-m-bottom_large" style="border: 1px solid #e2e8f0; border-radius: 8px; background: white;">
                                    <h3 class="slds-text-heading_small slds-m-bottom_medium" style="font-weight: 700; color: #1b3a4b; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
                                        ✈ Flight Leg Itinerary
                                    </h3>
                                    
                                    <div class="slds-scrollable_x" style="border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden;">
                                        <table class="slds-table slds-table_cell-buffer" style="background: white; font-size: 12px;">
                                            <thead>
                                                <tr class="slds-line-height_reset" style="background: #fafafa;">
                                                    <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Leg</th>
                                                    <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Segment</th>
                                                    <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Flight</th>
                                                    <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Departure Date</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={flightSegments} for:item="seg">
                                                    <tr key={seg.Id} style="border-bottom: 1px solid #e2e8f0;">
                                                        <td style="padding: 10px 12px; font-weight: 700;">#{seg.Segment_Order__c}</td>
                                                        <td style="padding: 10px 12px; font-weight: 600; color: #1e293b;">{seg.Name} → {seg.Destination__c}</td>
                                                        <td style="padding: 10px 12px; color: #64748b;">{seg.Carrier_Code__c} {seg.Flight_Number__c}</td>
                                                        <td style="padding: 10px 12px; color: #334155;">{seg.formattedDeparture}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </template>

                            <!-- Travelers Details -->
                            <div class="slds-p-around_medium slds-m-bottom_large" style="border: 1px solid #e2e8f0; border-radius: 8px; background: white;">
                                <h3 class="slds-text-heading_small slds-m-bottom_medium" style="font-weight: 700; color: #1b3a4b; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
                                    👤 Passenger & Ticket Details
                                </h3>

                                <template for:each={passengerDetails} for:item="p">
                                    <div key={p.Id} class="slds-p-vertical_small" style="border-bottom: 1px dashed #e2e8f0; font-size: 13px;">
                                        <div class="slds-grid slds-grid_align-spread">
                                            <span style="font-weight: 700; color: #0f172a;">{p.Full_Passenger_Name__c}</span>
                                            <span class="slds-badge slds-badge_lightest" style="font-size: 10px; background-color: #f1f5f9; color: #475569;">{p.Passenger_Type__c}</span>
                                        </div>
                                        <div class="slds-grid slds-wrap slds-m-top_xx-small" style="color: #64748b; font-size: 11px;">
                                            <div class="slds-m-right_large">DOB: {p.formattedDob}</div>
                                            <div class="slds-m-right_large">Meal: {p.formattedMeal}</div>
                                            <template if:true={p.Passport_Number__c}>
                                                <div>Passport: {p.Passport_Number__c}</div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                        </div>

                        <!-- Right Column: Fare Breakdown, Refunds & Cancel Trigger -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                            
                            <!-- Payment Details & Cost Summary -->
                            <div class="slds-p-around_medium slds-m-bottom_large" style="border: 1px solid #e2e8f0; border-radius: 8px; background: white;">
                                <h3 class="slds-text-heading_small slds-m-bottom_medium" style="font-weight: 700; color: #1b3a4b; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
                                    💵 Payment & Fare Summary
                                </h3>

                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small" style="font-size: 13px;">
                                    <span style="color: #64748b;">Seats Booked</span>
                                    <span style="font-weight: 700; color: #0f172a;">{numberOfSeats} seat(s)</span>
                                </div>

                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small" style="font-size: 13px;">
                                    <span style="color: #64748b;">Base Fare (Per Seat)</span>
                                    <span style="font-weight: 600; color: #0f172a;">{formattedBaseFare}</span>
                                </div>

                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small" style="font-size: 13px;">
                                    <span style="color: #64748b;">Taxes & Fees</span>
                                    <span style="font-weight: 600; color: #0f172a;">{formattedTaxes}</span>
                                </div>

                                <div class="slds-divider" style="border-bottom: 1px solid #e2e8f0; margin: 12px 0;"></div>

                                <div class="slds-grid slds-grid_align-spread" style="font-size: 16px; font-weight: 800; margin-bottom: 12px;">
                                    <span style="color: #0f172a;">Total Paid</span>
                                    <span style="color: #2e7d32;">{formattedTotalAmount}</span>
                                </div>

                                <template if:true={paymentRef}>
                                    <div style="font-size: 11px; color: #64748b; background: #f8fafc; padding: 8px; border-radius: 4px; font-family: monospace; border: 1px solid #e2e8f0;">
                                        Payment Ref: {paymentRef}
                                    </div>
                                </template>
                            </div>

                            <!-- Refund Status Tracker Component -->
                            <div class="slds-m-bottom_large">
                                <c-refund-status-tracker booking-id={bookingId}></c-refund-status-tracker>
                            </div>

                            <!-- Cancellation Block -->
                            <template if:true={canCancel}>
                                <div class="slds-p-around_medium" style="border: 1px solid #fee2e2; border-radius: 8px; background: #fef2f2; text-align: center;">
                                    <h4 style="font-weight: 700; color: #991b1b; margin-bottom: 8px; font-size: 14px;">Cancel Itinerary</h4>
                                    <p style="font-size: 12px; color: #b91c1c; margin-bottom: 14px;">Warning: Cancelling this itinerary is permanent and will trigger any applicable flight refund process.</p>
                                    <lightning-button
                                        variant="destructive"
                                        label="Cancel Booking"
                                        icon-name="utility:close"
                                        onclick={handleCancelTrigger}>
                                    </lightning-button>
                                </div>
                            </template>

                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- Cancellation Modal Window -->
        <template if:true={showCancelModal}>
            <c-cancellation-modal 
                booking-id={bookingId} 
                onclose={closeCancelModal}
                oncancelled={handleCancellationSuccess}>
            </c-cancellation-modal>
        </template>
    </div>
</template>
