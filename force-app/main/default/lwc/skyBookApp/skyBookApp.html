<template>
    <!-- Root Container -->
    <div class="slds-brand-band slds-brand-band_cover slds-brand-band_medium slds-p-around_medium" style="min-height: 100vh; background: #f3f4f6;">
        
        <!-- Global Spinner -->
        <template if:true={loading}>
            <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
        </template>

        <!-- Global Alert Notifications -->
        <template if:true={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert" style="border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <span class="slds-assistive-text">Error</span>
                <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Error">
                    <span style="font-size: 16px; margin-right: 8px;">⚠</span>
                </span>
                <h2>{errorMessage}</h2>
                <div class="slds-notify__close">
                    <button class="slds-button slds-button_icon slds-button_icon-inverse" title="Close" onclick={clearError}>
                        &times;
                    </button>
                </div>
            </div>
        </template>

        <template if:true={successMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_offline slds-m-bottom_medium" role="alert" style="border-radius: 8px; background-color: #2e7d32; color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <span class="slds-assistive-text">Success</span>
                <span class="slds-icon_container slds-icon-utility-success slds-m-right_x-small" title="Success">
                    <span style="font-size: 16px; margin-right: 8px;">✓</span>
                </span>
                <h2>{successMessage}</h2>
                <div class="slds-notify__close">
                    <button class="slds-button slds-button_icon slds-button_icon-inverse" title="Close" onclick={clearSuccess}>
                        &times;
                    </button>
                </div>
            </div>
        </template>

        <!-- Header / Navigation Bar -->
        <header class="slds-m-bottom_large" style="background: linear-gradient(135deg, #1b3a4b, #215a36); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden;">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-horizontal_large slds-p-vertical_medium">
                <!-- Branding/Logo -->
                <div class="slds-grid slds-grid_vertical-align-center" style="cursor: pointer;" onclick={navigateToDashboard}>
                    <div style="background: rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; margin-right: 12px; border: 1px solid rgba(255,255,255,0.25);">
                        ✈
                    </div>
                    <div>
                        <h1 class="slds-text-heading_medium" style="font-weight: 800; color: white; letter-spacing: 0.05em; line-height: 1.1;">SkyBook Pro</h1>
                        <p class="slds-text-body_small" style="color: #a3b899; font-weight: 500; font-size: 11px;">LIGHTNING PORTAL</p>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="slds-grid slds-grid_vertical-align-center" style="gap: 8px;">
                    <button class={dashboardNavClass} onclick={navigateToDashboard}>
                        📊 Agent Dashboard
                    </button>
                    <button class={searchNavClass} onclick={navigateToSearch}>
                        🔍 Search Flights
                    </button>
                    <button class={bookingsNavClass} onclick={navigateToMyBookings}>
                        📋 My Bookings
                    </button>
                </nav>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="slds-container_xlarge slds-container_center">
            
            <!-- 1. Agent Dashboard View -->
            <template if:true={isAgentDashboard}>
                <c-agent-dashboard
                    onsearchflight={navigateToSearch}
                    onviewbookings={navigateToMyBookings}
                    onviewbooking={handleViewBooking}>
                </c-agent-dashboard>
            </template>

            <!-- 2. Flight Search Form View -->
            <template if:true={isFlightSearch}>
                <c-flight-search-form 
                    onflightsearch={handleFlightSearch}>
                </c-flight-search-form>
            </template>

            <!-- 3. Flight Results List View -->
            <template if:true={isFlightResults}>
                <c-flight-results-list 
                    flight-offers={flightOffers}
                    onofferselected={handleOfferSelected}
                    onbacktosearch={navigateToSearch}>
                </c-flight-results-list>
            </template>

            <!-- 4. Passenger Details Form View -->
            <template if:true={isPassengerDetails}>
                <c-passenger-details-form 
                    passenger-count={passengerCount}
                    is-international={isInternationalFlight}
                    onpassengerssubmit={handlePassengersSubmit}
                    onbacktoresults={navigateToResults}>
                </c-passenger-details-form>
            </template>

            <!-- 5. Booking Confirmation View -->
            <template if:true={isBookingConfirm}>
                <c-booking-confirmation 
                    selected-flight={selectedFlight}
                    passenger-count={passengerCount}
                    passengers={passengers}
                    cabin-class={cabinClass}
                    onbookingcreated={handleBookingCreated}
                    onbacktopassengers={navigateToPassengers}>
                </c-booking-confirmation>
            </template>

            <!-- 6. Booking Success View -->
            <template if:true={isBookingSuccess}>
                <c-booking-success 
                    booking-id={bookingId}
                    booking-ref={bookingRef}
                    selected-flight={selectedFlight}
                    passenger-count={passengerCount}
                    onsearchagain={navigateToSearch}
                    onviewdetails={handleViewBooking}
                    onviewdashboard={navigateToDashboard}>
                </c-booking-success>
            </template>

            <!-- 7. My Bookings Dashboard View -->
            <template if:true={isMyBookings}>
                <c-my-bookings-dashboard 
                    onviewbooking={handleViewBooking}>
                </c-my-bookings-dashboard>
            </template>

            <!-- 8. Booking Detail View -->
            <template if:true={isBookingDetail}>
                <c-booking-detail-view 
                    booking-id={viewingBookingId}
                    onbacktobookings={navigateToMyBookings}>
                </c-booking-detail-view>
            </template>
            
        </main>
    </div>
</template>
