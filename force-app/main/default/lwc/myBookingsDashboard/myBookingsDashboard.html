<template>
    <div class="slds-card" style="border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; overflow: hidden; background: white;">
        
        <!-- Header -->
        <div class="slds-card__header slds-grid slds-grid_vertical-align-center slds-wrap" style="background: #fafafa; border-bottom: 1px solid #e5e7eb; padding: 16px 24px;">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <span style="font-size: 24px; display: inline-block;">📋</span>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title" style="font-size: 18px; font-weight: 700; color: #1b3a4b;">
                            My Bookings Dashboard
                        </h2>
                        <p class="slds-text-body_small slds-text-color_weak">Manage agent bookings and search passenger references</p>
                    </div>
                </header>
            </div>
            
            <!-- Global Search Box -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-top_small slds-medium-m-top_none">
                <div class="slds-grid slds-grid_vertical-align-center" style="gap: 12px;">
                    <div class="slds-grow">
                        <lightning-input
                            type="search"
                            variant="label-hidden"
                            name="searchKey"
                            value={searchKey}
                            placeholder="Search name, email, booking ref..."
                            onchange={handleSearchChange}>
                        </lightning-input>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh Bookings"
                        onclick={handleRefresh}>
                    </lightning-button-icon>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="slds-card__body slds-card__body_inner slds-p-around_large">
            <!-- Spinner -->
            <template if:true={loading}>
                <div style="height: 120px; position: relative;">
                    <lightning-spinner alternative-text="Loading bookings..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Bookings List table/cards -->
            <template if:false={loading}>
                <!-- Custom SLDS Filter Tabs -->
                <div class="slds-tabs_default slds-m-bottom_medium">
                    <ul class="slds-tabs_default__nav" role="tablist" style="border-bottom: 2px solid #e2e8f0;">
                        <li class={tabClassAll} role="presentation">
                            <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" data-value="all" onclick={handleTabSelect} style="font-weight: 700;">All</a>
                        </li>
                        <li class={tabClassUpcoming} role="presentation">
                            <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" data-value="upcoming" onclick={handleTabSelect} style="font-weight: 700;">Upcoming</a>
                        </li>
                        <li class={tabClassPast} role="presentation">
                            <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" data-value="past" onclick={handleTabSelect} style="font-weight: 700;">Past</a>
                        </li>
                        <li class={tabClassCancelled} role="presentation">
                            <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" data-value="cancelled" onclick={handleTabSelect} style="font-weight: 700;">Cancelled</a>
                        </li>
                    </ul>
                </div>

                <template if:true={hasBookings}>
                    <!-- Controls -->
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium" style="font-size: 13px;">
                        <span style="font-weight: 600; color: #64748b;">Showing {bookingsCount} booking(s)</span>
                        <div class="slds-grid slds-grid_align-center" style="gap: 8px;">
                            <span style="color: #64748b;">Sort:</span>
                            <a href="javascript:void(0);" onclick={toggleSort} style="font-weight: 700; color: #1b3a4b;">{sortLabel}</a>
                        </div>
                    </div>

                    <!-- SLDS Table -->
                    <div class="slds-scrollable_x" style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
                        <table class="slds-table slds-table_cell-buffer" style="background: white;">
                            <thead>
                                <tr class="slds-line-height_reset" style="background: #fafafa; border-bottom: 1px solid #e2e8f0;">
                                    <th scope="col" style="padding: 12px 16px; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase;">Reference</th>
                                    <th scope="col" style="padding: 12px 16px; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase;">Flight Details</th>
                                    <th scope="col" style="padding: 12px 16px; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase;">Departure Date</th>
                                    <th scope="col" style="padding: 12px 16px; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase;">Seat Class</th>
                                    <th scope="col" style="padding: 12px 16px; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase;">Status</th>
                                    <th scope="col" style="padding: 12px 16px; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase; text-align: right;">Amount</th>
                                    <th scope="col" style="padding: 12px 16px; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase; text-align: center;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={sortedBookings} for:item="bk">
                                    <tr key={bk.Id} class="slds-hint-parent" style="border-bottom: 1px solid #e2e8f0;">
                                        <td style="padding: 16px; font-weight: 800; color: #1b3a4b;">
                                            {bk.Name}
                                        </td>
                                        <td style="padding: 16px; color: #1e293b; font-weight: 600;">
                                            <div>{bk.routeText}</div>
                                            <div style="font-size: 11px; color: #64748b; font-weight: 500;">{bk.airlineText}</div>
                                        </td>
                                        <td style="padding: 16px; color: #4b5563; font-weight: 500;">
                                            {bk.formattedDeparture}
                                        </td>
                                        <td style="padding: 16px; color: #4b5563; font-weight: 500;">
                                            {bk.Seat_Class__c}
                                        </td>
                                        <td style="padding: 16px;">
                                            <span class={bk.badgeClass}>{bk.Booking_Status__c}</span>
                                        </td>
                                        <td style="padding: 16px; text-align: right; font-weight: 700; color: #1e293b;">
                                            {bk.formattedAmount}
                                        </td>
                                        <td style="padding: 16px; text-align: center;">
                                            <lightning-button
                                                variant="brand-outline"
                                                label="View Details"
                                                icon-name="utility:open"
                                                data-id={bk.Id}
                                                onclick={handleViewDetails}>
                                            </lightning-button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <!-- Empty State -->
                <template if:false={hasBookings}>
                    <div class="slds-text-align_center slds-p-vertical_xx-large" style="border: 1px dashed #cbd5e1; border-radius: 8px; background: #fafafa;">
                        <span style="font-size: 48px; display: block; margin-bottom: 12px;">📂</span>
                        <h3 class="slds-text-heading_small" style="font-weight: 700; color: #1b3a4b;">No Bookings Found</h3>
                        <p class="slds-text-color_weak slds-m-bottom_medium">No confirmed bookings match your search key or agent profile.</p>
                        <lightning-button label="Clear Search" onclick={handleClearSearch} if:true={searchKey}></lightning-button>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
