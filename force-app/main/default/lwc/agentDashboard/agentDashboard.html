<template>
    <div class="slds-card" style="border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; overflow: hidden; background: white;">
        
        <!-- Header -->
        <div class="slds-card__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap" style="background: #fafafa; border-bottom: 1px solid #e5e7eb; padding: 16px 24px;">
            <div class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <span style="font-size: 24px; display: inline-block;">📊</span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title" style="font-size: 18px; font-weight: 700; color: #1b3a4b;">
                        Agent Dashboard
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">Operational overview, revenue analytics, and upcoming flights</p>
                </div>
            </div>
            
            <div class="slds-grid slds-grid_vertical-align-center" style="gap: 12px; flex-wrap: wrap;">
                <lightning-button 
                    variant="neutral" 
                    label="View My Bookings" 
                    icon-name="utility:table" 
                    onclick={handleViewBookings}>
                </lightning-button>
                <lightning-button 
                    variant="neutral" 
                    label="Create Walk-in Booking (Coming Soon)" 
                    icon-name="utility:agent" 
                    disabled>
                </lightning-button>
                <lightning-button 
                    variant="brand" 
                    label="Start New Flight Search" 
                    icon-name="utility:search" 
                    onclick={handleSearchRedirect}>
                </lightning-button>
            </div>
        </div>

        <!-- Body -->
        <div class="slds-card__body slds-card__body_inner slds-p-around_large">
            <!-- Spinner -->
            <template if:true={loading}>
                <div style="height: 200px; position: relative;">
                    <lightning-spinner alternative-text="Loading dashboard data..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Dashboard Content -->
            <template if:false={loading}>
                <!-- KPI Grid -->
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_large">
                    <!-- Total Revenue Card -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #e2e8f0; border-radius: 8px; background: linear-gradient(135deg, #1b3a4b, #2c5d75); color: white; box-shadow: 0 2px 8px rgba(27,58,75,0.15);">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; opacity: 0.8;">Total Revenue</div>
                            <div style="font-size: 20px; font-weight: 800; margin-top: 4px;">{formattedRevenue}</div>
                        </div>
                    </div>
                    <!-- Confirmed Bookings -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #d1fae5; border-radius: 8px; background: #ecfdf5;">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #065f46;">Confirmed</div>
                            <div style="font-size: 20px; font-weight: 800; color: #047857; margin-top: 4px;">{confirmedCount}</div>
                        </div>
                    </div>
                    <!-- Cancelled Bookings -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #fee2e2; border-radius: 8px; background: #fef2f2;">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #991b1b;">Cancelled</div>
                            <div style="font-size: 20px; font-weight: 800; color: #b91c1c; margin-top: 4px;">{cancelledCount}</div>
                        </div>
                    </div>
                    <!-- Draft Bookings -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #fef3c7; border-radius: 8px; background: #fffdf5;">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #92400e;">Draft</div>
                            <div style="font-size: 20px; font-weight: 800; color: #b45309; margin-top: 4px;">{draftCount}</div>
                        </div>
                    </div>
                    <!-- Total Bookings -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #475569;">Total Bookings</div>
                            <div style="font-size: 20px; font-weight: 800; color: #1e293b; margin-top: 4px;">{totalCount}</div>
                        </div>
                    </div>
                </div>

                <!-- Actionable Today KPI Grid -->
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_large" style="border-top: 1px dashed #cbd5e1; padding-top: 16px;">
                    <!-- Today's Revenue Card -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #cbd5e1; border-radius: 8px; background: linear-gradient(135deg, #0f766e, #14b8a6); color: white; box-shadow: 0 2px 8px rgba(15,118,110,0.15);">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; opacity: 0.9;">Today's Revenue</div>
                            <div style="font-size: 20px; font-weight: 800; margin-top: 4px;">{formattedTodayRevenue}</div>
                        </div>
                    </div>
                    <!-- Today's Bookings Card -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #bae6fd; border-radius: 8px; background: #f0f9ff;">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #0369a1;">Today's Bookings</div>
                            <div style="font-size: 20px; font-weight: 800; color: #0284c7; margin-top: 4px;">{todayBookingsCount}</div>
                        </div>
                    </div>
                    <!-- Pending Approvals Card -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #fde68a; border-radius: 8px; background: #fef3c7;">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #b45309;">Pending Group Approvals</div>
                            <div style="font-size: 20px; font-weight: 800; color: #d97706; margin-top: 4px;">{pendingGroupApprovals}</div>
                        </div>
                    </div>
                    <!-- Active Cancellations Card -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_small">
                        <div class="slds-p-around_medium" style="border: 1px solid #fecdd3; border-radius: 8px; background: #fff5f5;">
                            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #be123c;">Active Cancellations</div>
                            <div style="font-size: 20px; font-weight: 800; color: #e11d48; margin-top: 4px;">{activeCancellationCases}</div>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Left Column: Revenue performance -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12 slds-m-bottom_large">
                        <div class="slds-p-around_medium" style="border: 1px solid #e2e8f0; border-radius: 8px; background: white;">
                            <h3 class="slds-text-heading_small slds-m-bottom_medium" style="font-weight: 700; color: #1b3a4b; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
                                📈 Monthly Sales Performance
                            </h3>
                            
                            <template if:true={hasMonthlyRevenue}>
                                <template for:each={monthlyRevenue} for:item="rev">
                                    <div key={rev.monthName} class="slds-m-bottom_medium">
                                        <div class="slds-grid slds-grid_align-spread" style="font-size: 12px; margin-bottom: 4px;">
                                            <span style="font-weight: 600; color: #334155;">{rev.monthName}</span>
                                            <span style="font-weight: 700; color: #1e293b;">{rev.formattedRevenue}</span>
                                        </div>
                                        <div class="slds-progress-bar slds-progress-bar_medium" aria-valuemin="0" aria-valuemax="100" aria-valuenow={rev.percent} role="progressbar">
                                            <span class="slds-progress-bar__value" style={rev.progressStyle}>
                                                <span class="slds-assistive-text">Progress: {rev.percent}%</span>
                                            </span>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <template if:false={hasMonthlyRevenue}>
                                <div class="slds-text-align_center slds-p-vertical_large" style="color: #64748b;">
                                    No historical revenue logs recorded.
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Right Column: Upcoming departures -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12 slds-m-bottom_large">
                        <div class="slds-p-around_medium" style="border: 1px solid #e2e8f0; border-radius: 8px; background: white;">
                            <h3 class="slds-text-heading_small slds-m-bottom_medium" style="font-weight: 700; color: #1b3a4b; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
                                📅 Upcoming Flight Departures (Next 10)
                            </h3>

                            <template if:true={hasUpcomingFlights}>
                                <div class="slds-scrollable_x" style="border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden;">
                                    <table class="slds-table slds-table_cell-buffer" style="background: white; font-size: 12px;">
                                        <thead>
                                            <tr class="slds-line-height_reset" style="background: #fafafa;">
                                                <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Flight</th>
                                                <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Route</th>
                                                <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Departure Date</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={upcomingFlights} for:item="fl">
                                                <tr key={fl.Id} style="border-bottom: 1px solid #e2e8f0;">
                                                    <td style="padding: 10px 12px; font-weight: 700; color: #1e293b;">{fl.Airline_Name__c} {fl.Name}</td>
                                                    <td style="padding: 10px 12px; font-weight: 600; color: #334155;">{fl.Origin_Airport__c} → {fl.Destination_Airport__c}</td>
                                                    <td style="padding: 10px 12px; color: #64748b;">{fl.formattedDeparture}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template if:false={hasUpcomingFlights}>
                                <div class="slds-text-align_center slds-p-vertical_large" style="color: #64748b;">
                                    No future flights scheduled in the system.
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Recent Bookings Section -->
                <div class="slds-p-around_medium slds-m-top_large" style="border: 1px solid #cbd5e1; border-radius: 8px; background: white;">
                    <h3 class="slds-text-heading_small slds-m-bottom_medium" style="font-weight: 700; color: #1b3a4b; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px;">
                        🕒 Recent Bookings (Newest First)
                    </h3>
                    
                    <template if:true={hasRecentBookings}>
                        <div class="slds-scrollable_x" style="border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden;">
                            <table class="slds-table slds-table_cell-buffer" style="background: white; font-size: 12px;">
                                <thead>
                                    <tr class="slds-line-height_reset" style="background: #fafafa;">
                                        <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Booking Ref</th>
                                        <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Route / Flight</th>
                                        <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Booking Date</th>
                                        <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Status</th>
                                        <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569;">Total Paid</th>
                                        <th scope="col" style="padding: 8px 12px; font-weight: 700; color: #475569; text-align: right;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={recentBookings} for:item="b">
                                        <tr key={b.Id} style="border-bottom: 1px solid #e2e8f0;">
                                            <td style="padding: 10px 12px; font-weight: 700; color: #1e293b;">
                                                <a href="javascript:void(0);" data-id={b.Id} onclick={handleViewBooking} style="color: #0284c7; text-decoration: none;">{b.Name}</a>
                                            </td>
                                            <td style="padding: 10px 12px; font-weight: 600; color: #334155;">
                                                {b.flightRoute} <span style="font-size: 10px; color: #64748b; font-weight: normal; margin-left: 4px;">({b.Seat_Class__c})</span>
                                            </td>
                                            <td style="padding: 10px 12px; color: #64748b;">{b.formattedDate}</td>
                                            <td style="padding: 10px 12px;">
                                                <span class={b.badgeClass}>{b.Booking_Status__c}</span>
                                            </td>
                                            <td style="padding: 10px 12px; font-weight: 700; color: #1b3a4b;">{b.formattedAmount}</td>
                                            <td style="padding: 10px 12px; text-align: right;">
                                                <lightning-button 
                                                    variant="neutral" 
                                                    label="View Details" 
                                                    icon-name="utility:zoomin" 
                                                    data-id={b.Id}
                                                    onclick={handleViewBooking}>
                                                </lightning-button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    
                    <template if:false={hasRecentBookings}>
                        <div class="slds-text-align_center slds-p-vertical_large" style="color: #64748b;">
                            No recent bookings made by you yet.
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
